name: Armed Alert (intraday)

# ═══════════════════════════════════════════════════════════════════════════
# เช็คทุก 15 นาทีตลอดหน้าต่างเทรด · ส่งเมลเฉพาะตอนเพิ่งเข้าเกณฑ์
# · บันทึก forward test · บันทึก option 0DTE ทุก strike
#
# ทำไมวนลูปในงานเดียว ไม่ใช่ตั้ง cron 17 รอบ:
#   ของเดิมตั้ง cron ไว้ 17 รอบ/วัน แต่วันจันทร์ 10 ส.ค. GitHub ยิงจริงแค่ 5 รอบ
#   (15:27 · 16:06 · 17:06 · 18:01 · 19:11 UTC) อีก 12 รอบหายไปเฉย ๆ ไม่ใช่ cancelled
#   = GitHub ไม่ได้แค่ดีเลย์ มันทิ้งรอบทิ้ง ยิงจริงราวชั่วโมงละครั้งไม่ว่าจะตั้งถี่แค่ไหน
#   → ให้ cron ยิงครั้งเดียวพอ แล้ว "งาน" นั้นนอนรอเองทุก 15 นาที ซึ่งควบคุมได้จริง
#
# ⚠️ แก้ใหญ่ 25 ก.ย. 2026 — ที่เก็บข้อมูลมาทั้งเดือนเป็นตัวอย่างที่เอียง
# ───────────────────────────────────────────────────────────────────────────
# ของเดิมตั้ง cron 12:50 UTC โดยคำนวณจากดีเลย์ที่วัดได้ตอนนั้น (35–41 นาที)
# แต่ดีเลย์ของ GitHub โตขึ้นเป็น 220–590 นาทีตั้งแต่ 27 ส.ค. งานจึงเริ่มตอน 16:44–18:39 UTC
# ขณะที่ `WINDOW_END` ฝังไว้ที่ 18:35 UTC → หลายวันงานเริ่มแล้วออกทันทีเพราะหน้าต่างปิดไปแล้ว
#
# ผลที่พิสูจน์ได้จาก forward_test/log/ (550 record · 27 วัน):
#     ช่วง 09:xx ET  มีแค่  10 record ทั้งเดือน   ← ช่วงสังเกตที่ตั้งใจเก็บ แทบไม่มีเลย
#     ช่วง 13:xx ET  มี    168 record
#     14 ก.ย. เก็บได้ 6 จุด (14:13–14:22)  ·  24 ก.ย. เก็บได้ 2 จุด
# แปลว่าชุดข้อมูลที่จะเอาไปวัด edge เป็นภาพ "ท้ายวัน" ล้วน ไม่ใช่ทั้งวัน
# สรุปอะไรจากมันตอนนี้ก็เอียงหมด — นี่คือสาเหตุที่ระบบดูไม่แม่น
#
# ✅ ทางแก้ (แนวเดียวกับ daily-report.yml):
#   1. เวลาทั้งหมดคำนวณจาก market_clock.py เป็น "นาทีนับจากระฆังเปิด" → DST ถูกเอง
#      และวันหยุดตลาดข้ามให้เอง (ของเดิมเผารันเนอร์ในวันหยุดทุกครั้ง)
#   2. cron เป็นบันไดทุก 30 นาที ครอบดีเลย์ 0–6 ชม.
#   3. แต่ละชั้นตัดสินเองว่า "ยังคุ้มจะเริ่มไหม" — เริ่มเร็วไปจนงานจะโดน timeout
#      ก่อนถึงขั้นตอน commit ก็ออกเลย (งานโดนฆ่า = ข้อมูลทั้งวันหาย ไม่ได้ commit)
#
# วันหนึ่งแบ่งเป็นสองช่วง (นับจากระฆังเปิด):
#   −2 ถึง +48 นาที   สังเกตอย่างเดียว — ประเมินและบันทึกทุก 15 นาที แต่ไม่ส่งเมล ไม่เปิดไม้
#                     เพราะชั่วโมงแรกเป็นช่วง gamma whipsaw ที่ไม่ควรเข้าอยู่แล้ว
#                     แต่เป็นช่วงที่ราคาขยับแรงที่สุด — ไม่เก็บไว้ก็ตอบทีหลังไม่ได้ว่าเกิดอะไรขึ้น
#                     (เคสจริง 2026-08-19: ราคาไหล 721→712 ตอน 09:45 แล้วเราไม่มีข้อมูลช่วงนั้นเลย)
#   +48 ถึง +305 นาที ทำงานเต็ม — ส่งเมลตอนเข้าเกณฑ์ และบันทึก forward test
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # บันไดทุก 30 นาที · นาทีที่ 07/37 ไม่ใช่ :00/:30 เพราะต้นชั่วโมงคือช่วงที่ GitHub แน่นสุด
    # ชั้นที่ตกนอกกรอบจะออกเองภายใน ~20 วินาที (เช็คนาฬิกาก่อนลง dependency)
    - cron: "7,37 7-14 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols คั่นด้วย , (เช่น QQQ,SPY)"
        required: false
        default: "QQQ"
      minutes:
        description: "วนกี่นาที (ทดสอบ — ใส่ 1 เพื่อเช็ครอบเดียวแล้วจบ)"
        required: false
        default: "350"
      always_send:
        description: "ส่งแม้ไม่ ARMED และแม้สถานะไม่เปลี่ยน (ไว้ทดสอบ)"
        type: boolean
        default: false

concurrency:
  group: armed-alert
  cancel-in-progress: false

permissions:
  contents: write          # ต้องเขียน forward_test/ledger.json กลับเข้ารีโป

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # เพดาน job ของ GitHub = 6 ชม. · เว้นที่ให้ commit ตอนท้าย
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ── ตัดสินก่อนลง dependency ว่าวันนี้/รอบนี้ทำงานไหม ──────────
      # market_clock ใช้แต่ stdlib จึงเช็คได้ทันทีหลัง checkout
      - name: Plan the window
        id: plan
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'yes' || 'no' }}
          ALWAYS: ${{ inputs.always_send }}
        run: |
          set -u
          if [ "$(python market_clock.py trading)" != "1" ]; then
            echo "วันนี้ตลาดไม่เปิด — จบงาน"
            python market_clock.py info
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python market_clock.py info

          OPEN=$(python market_clock.py epoch --slot open)
          CLOSE=$(python market_clock.py epoch --slot close)

          # หน้าต่างเป็น "นาทีนับจากระฆังเปิด" → EDT/EST ถูกเองโดยไม่ต้องแก้อะไร
          OBSERVE_FROM=$(( OPEN - 2 * 60 ))       # −2 นาที
          TRADE_FROM=$((  OPEN + 48 * 60 ))       # +48 นาที
          WINDOW_END=$((  OPEN + 305 * 60 ))      # +305 นาที (14:35 ET)
          # วันครึ่งวันปิด 13:00 ET — อย่าวนเลยเวลาปิดจริง
          [ "$WINDOW_END" -gt "$CLOSE" ] && WINDOW_END=$CLOSE

          NOW=$(date -u +%s)
          MAX_JOB_MIN=335        # ต้องจบ + commit ให้ทันก่อน timeout-minutes

          if [ "$MANUAL" = "yes" ] && [ "$ALWAYS" = "true" ]; then
            echo "กดเองพร้อม always_send — ข้ามด่านเวลาทั้งหมด"
            OBSERVE_FROM=$NOW; TRADE_FROM=$NOW
          elif [ "$NOW" -ge "$WINDOW_END" ]; then
            echo "หน้าต่างปิดไปแล้ว (ตอนนี้ $(date -u +%H:%M) UTC) — ออกเลย"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          elif [ $(( (WINDOW_END - NOW) / 60 )) -gt "$MAX_JOB_MIN" ]; then
            # เริ่มตอนนี้ = งานจะโดนฆ่าก่อนถึงขั้นตอน commit → ข้อมูลทั้งวันหาย
            echo "ยังเช้าเกินไป (เหลืออีก $(( (WINDOW_END - NOW) / 60 )) นาทีถึงปิดหน้าต่าง"
            echo " ซึ่งเกินที่ job เดียวรับไหว) — ปล่อยให้ cron ชั้นถัดไปรับไป"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          {
            echo "go=yes"
            echo "observe_from=$OBSERVE_FROM"
            echo "trade_from=$TRADE_FROM"
            echo "window_end=$WINDOW_END"
          } >> "$GITHUB_OUTPUT"
          echo "จะทำงาน: สังเกตตั้งแต่ $(date -u -d "@$OBSERVE_FROM" +%H:%M)"\
               "· เต็มรูปแบบตั้งแต่ $(date -u -d "@$TRADE_FROM" +%H:%M)"\
               "· ปิดหน้าต่าง $(date -u -d "@$WINDOW_END" +%H:%M) UTC"

      - name: Install dependencies
        if: steps.plan.outputs.go == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Restore gate state
        if: steps.plan.outputs.go == 'yes'
        uses: actions/cache/restore@v6
        with:
          path: .gate-state.json
          key: gate-state-${{ github.run_id }}
          restore-keys: gate-state-

      - name: Poll every 15 minutes until the window closes
        if: steps.plan.outputs.go == 'yes'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SYMBOLS:   ${{ inputs.symbols || 'QQQ' }}
          GATE_STATE_FILE: .gate-state.json
          FLAGS: ${{ inputs.always_send == true && ' ' || '--armed-only --only-on-change' }}
          RUN_MINUTES:  ${{ inputs.minutes || '350' }}
          OBSERVE_FROM: ${{ steps.plan.outputs.observe_from }}
          TRADE_FROM:   ${{ steps.plan.outputs.trade_from }}
          WINDOW_END:   ${{ steps.plan.outputs.window_end }}
        run: |
          set -u
          HARD_STOP=$(( $(date -u +%s) + RUN_MINUTES * 60 ))
          END=$(( WINDOW_END < HARD_STOP ? WINDOW_END : HARD_STOP ))

          # cron มาก่อนระฆังเปิดก็นอนรอ — เช็ค END ด้วย ไม่งั้นตอนทดสอบ minutes=1
          # จะนอนข้ามเวลาจบไปเลย
          now=$(date -u +%s)
          if [ "$now" -lt "$OBSERVE_FROM" ] && [ "$OBSERVE_FROM" -lt "$END" ]; then
            echo "มาก่อนเวลา — นอนรอถึง $(date -u -d "@$OBSERVE_FROM" +%H:%M) UTC"\
                 "อีก $(( (OBSERVE_FROM - now) / 60 )) นาที"
            sleep $(( OBSERVE_FROM - now ))
          fi

          # นอนจนถึงนาทีที่ 7/22/37/52 ถัดไป — ให้จังหวะเช็คตรงขอบ 15 นาทีจริง ๆ
          sleep_to_next_mark() {
            m=$(date -u +%-M); s=$(date -u +%-S)
            for t in 7 22 37 52; do
              if [ "$m" -lt "$t" ]; then echo $(( (t - m) * 60 - s )); return; fi
            done
            echo $(( (67 - m) * 60 - s ))
          }

          n=0
          while :; do
            n=$((n + 1))
            now=$(date -u +%s)
            # ก่อน TRADE_FROM = บันทึกอย่างเดียว ไม่ส่งเมล ไม่เปิดไม้
            if [ "$now" -lt "$TRADE_FROM" ]; then
              phase="สังเกต"; mode="--log-only"
            else
              phase="เต็มรูปแบบ"; mode="$FLAGS"
            fi
            echo "───── รอบที่ $n · $(date -u +%H:%M:%S) UTC · $phase ─────"

            # || true ทุกคำสั่ง — รอบเดียวพังต้องไม่ทำให้ลูปทั้งวันตาย
            python send_report.py --no-cme $mode || echo "!! send_report พังรอบนี้ ข้ามไป"

            # เก็บ option 0DTE ทุก strike — ต้องทำทุกรอบรวมช่วงสังเกต
            # เพราะชั่วโมงแรกคือช่วงที่ flow เปลี่ยนเร็วที่สุด
            python zero_dte_cli.py record --symbols "$SYMBOLS" \
              || echo "!! บันทึก 0DTE รอบนี้ไม่สำเร็จ ข้ามไป"

            if [ "$now" -ge "$TRADE_FROM" ]; then
              # สองระบบเดินคู่กัน คนละ ledger — วันหนึ่งจะมีอย่างมากอันเดียวที่ ARMED
              # (fade ต้องการราคาในโซน · breakout ต้องการนอกโซน) เรียกทั้งคู่ทุกรอบได้เลย
              python run_forward_test.py record --system fade \
                || echo "!! record fade พังรอบนี้ ข้ามไป"
              python run_forward_test.py record --system breakout \
                || echo "!! record breakout พังรอบนี้ ข้ามไป"
            fi

            now=$(date -u +%s)
            [ "$now" -ge "$END" ] && break
            nap=$(sleep_to_next_mark)
            [ "$(( now + nap ))" -ge "$END" ] && break
            echo "นอน ${nap}s ถึงขอบถัดไป"
            sleep "$nap"
          done
          echo "จบ — เช็คไปทั้งหมด $n รอบ"

      - name: Save gate state
        if: always() && steps.plan.outputs.go == 'yes'
        uses: actions/cache/save@v6
        with:
          path: .gate-state.json
          key: gate-state-${{ github.run_id }}

      - name: Commit forward test ledger
        if: always() && steps.plan.outputs.go == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_test/ zero_dte/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน — ไม่ต้อง commit"
            exit 0
          fi

          # ── รวมระดับข้อมูล ไม่ใช่ระดับข้อความ ──
          # เดิม commit แล้ว `git pull --rebase` + retry 3 รอบ · พังจริงที่ run #33:
          #   CONFLICT (content): Merge conflict in forward_test/log/2026-08.jsonl
          # retry ไม่ช่วยเลยเพราะไม่ใช่ race — เนื้อไฟล์ชนกันจริง ลองใหม่ก็ชนเหมือนเดิมทั้ง 3 รอบ
          # ไฟล์พวกนี้เป็นชุด record ที่มี key (trade id / ts+sym+sys) รวมได้แบบไม่มีทางขัดกัน
          STASH=$(mktemp -d)
          python merge_data.py --save "$STASH"

          pushed=""
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((i * 5)); continue; }
            git reset --hard "origin/${GITHUB_REF_NAME}"   # ปลอดภัย: ข้อมูลอยู่ใน $STASH แล้ว
            python merge_data.py --merge "$STASH"
            git add forward_test/ zero_dte/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "หลังรวมแล้วไม่มีอะไรใหม่ (อีกงานบันทึกไปแล้ว) — ไม่ต้อง push"
              pushed="yes"; break
            fi
            git commit -m "forward test: เปิดไม้จำลอง [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed="yes"; break; fi
            echo "push รอบ $i ไม่สำเร็จ — ดึงของใหม่แล้วรวมอีกครั้ง"
            sleep $((i * 5))
          done

          rm -rf "$STASH"
          if [ -z "$pushed" ]; then
            echo "::error::push ข้อมูล forward test ไม่สำเร็จหลังลอง 3 รอบ"
            exit 1
          fi
