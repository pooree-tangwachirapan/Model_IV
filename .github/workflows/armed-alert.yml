name: Armed Alert (intraday)

# เช็คทุก 15 นาทีตลอดหน้าต่างเทรด · ส่งเมลเฉพาะตอนเพิ่งเข้าเกณฑ์ · บันทึก forward test ไปด้วย
#
# ทำไมวนลูปในงานเดียว ไม่ใช่ตั้ง cron 17 รอบ:
#   ของเดิมตั้ง cron ไว้ 17 รอบ/วัน แต่วันจันทร์ 10 ส.ค. GitHub ยิงจริงแค่ 5 รอบ
#   (15:27 · 16:06 · 17:06 · 18:01 · 19:11 UTC) อีก 12 รอบหายไปเฉย ๆ ไม่ใช่ cancelled
#   = GitHub ไม่ได้แค่ดีเลย์ มันทิ้งรอบทิ้ง ยิงจริงราวชั่วโมงละครั้งไม่ว่าจะตั้งถี่แค่ไหน
#   → ให้ cron ยิงครั้งเดียวพอ แล้ว "งาน" นั้นนอนรอเองทุก 15 นาที ซึ่งควบคุมได้จริง
#
# วันหนึ่งแบ่งเป็นสองช่วง:
#   09:28–10:18 ET  สังเกตอย่างเดียว — ประเมินและบันทึก log ทุก 15 นาที แต่ไม่ส่งเมล ไม่เปิดไม้
#                   เพราะชั่วโมงแรกเป็นช่วง gamma whipsaw ที่ไม่ควรเข้าอยู่แล้ว
#                   แต่เป็นช่วงที่ราคาขยับแรงที่สุด — ไม่เก็บไว้ก็ตอบทีหลังไม่ได้ว่าเกิดอะไรขึ้น
#                   (เคสจริง 2026-08-19: ราคาไหล 721→712 ตอน 09:45 แล้วเราไม่มีข้อมูลช่วงนั้นเลย)
#   10:18–14:35 ET  ทำงานเต็ม — ส่งเมลตอนเข้าเกณฑ์ และบันทึก forward test
#
# cron 3 ตัวเป็นตัวสำรองซ้อนกัน เผื่อตัวแรกโดนทิ้ง — ตัวที่มาทีหลังเห็นว่าหน้าต่างปิดแล้วก็ออกเอง
# concurrency ตั้ง cancel-in-progress: false เพื่อไม่ให้ตัวสำรองไปฆ่างานที่กำลังวิ่งอยู่
#
# ข้อจำกัดที่เหลือ: cron เป็น UTC ไม่รู้จัก DST — ตารางนี้ตั้งสำหรับ EDT (มี.ค.–พ.ย.)
# ช่วง EST ต้องบวก 1 ชม. ทุกบรรทัด รวมทั้ง WINDOW_END ด้านล่าง

on:
  schedule:
    # ตั้งไว้ 12:50 ทั้งที่อยากเริ่ม 13:28 — เพราะ GitHub ดีเลย์ตารางนี้ 35–41 นาทีทุกวัน
    # (20 ส.ค. 36 · 21 ส.ค. 35 · 24 ส.ค. 40 · 25 ส.ค. 41) ตั้งตรงเวลาแล้วได้ 14:0x ทุกครั้ง
    # ซึ่งกินช่วงสังเกตหมด · ตั้งเผื่อ 38 นาทีแล้วมันจะมาลงราว ๆ ระฆังเปิดพอดี
    # ถ้าวันไหน GitHub เร็วผิดปกติ ลูปมีตัวกันไม่ให้เริ่มก่อน OBSERVE_FROM อยู่แล้ว
    - cron: "50 12 * * 1-5"
    - cron: "50 13 * * 1-5"    # สำรอง เผื่อรอบแรกโดนทิ้ง
    - cron: "50 14 * * 1-5"    # สำรองอีกชั้น
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols คั่นด้วย , (เช่น QQQ,SPY)"
        required: false
        default: "QQQ"
      minutes:
        description: "วนกี่นาที (ทดสอบ — ใส่ 1 เพื่อเช็ครอบเดียวแล้วจบ)"
        required: false
        default: "350"
      always_send:
        description: "ส่งแม้ไม่ ARMED และแม้สถานะไม่เปลี่ยน (ไว้ทดสอบ)"
        type: boolean
        default: false

concurrency:
  group: armed-alert
  cancel-in-progress: false

permissions:
  contents: write          # ต้องเขียน forward_test/ledger.json กลับเข้ารีโป

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 358       # เริ่มได้เร็วสุด 12:50 ถึง 18:35 UTC = 5 ชม. 45 นาที (เพดาน job = 6 ชม.)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Restore gate state
        uses: actions/cache/restore@v6
        with:
          path: .gate-state.json
          key: gate-state-${{ github.run_id }}
          restore-keys: gate-state-

      - name: Poll every 15 minutes until the window closes
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SYMBOLS:   ${{ inputs.symbols || 'QQQ' }}
          GATE_STATE_FILE: .gate-state.json
          FLAGS: ${{ inputs.always_send == true && ' ' || '--armed-only --only-on-change' }}
          RUN_MINUTES: ${{ inputs.minutes || '350' }}
          # กดเองพร้อม always_send = ข้ามช่วงสังเกต ให้ทำงานเต็มตั้งแต่รอบแรก
          TRADE_FROM_HHMM: ${{ inputs.always_send == true && '00:00' || '14:18' }}
          # ห้ามเริ่มประเมินก่อนเวลานี้ — กันกรณี cron มาตรงเวลาแล้วเผารันเนอร์ทิ้งก่อนตลาดเปิด
          OBSERVE_FROM_HHMM: ${{ inputs.always_send == true && '00:00' || '13:28' }}
        run: |
          set -u
          WINDOW_END=$(date -u -d "18:35" +%s)          # ปิดหน้าต่าง 14:35 ET
          TRADE_FROM=$(date -u -d "$TRADE_FROM_HHMM" +%s)  # ก่อนเวลานี้ = สังเกตอย่างเดียว
          OBSERVE_FROM=$(date -u -d "$OBSERVE_FROM_HHMM" +%s)
          HARD_STOP=$(( $(date -u +%s) + RUN_MINUTES * 60 ))
          END=$(( WINDOW_END < HARD_STOP ? WINDOW_END : HARD_STOP ))

          if [ "$(date -u +%s)" -ge "$END" ]; then
            echo "หน้าต่างปิดไปแล้ว (ตอนนี้ $(date -u +%H:%M) UTC) — ออกเลย ไม่ต้องทำอะไร"
            exit 0
          fi

          # cron ตั้งเผื่อดีเลย์ไว้ ถ้าวันไหนมาตรงเวลาจริงก็นอนรอถึงเวลาที่ตั้งใจ
          # เช็ค END ด้วย ไม่งั้นตอนทดสอบ minutes=1 จะนอนข้ามเวลาจบไปเลย
          now=$(date -u +%s)
          if [ "$now" -lt "$OBSERVE_FROM" ] && [ "$OBSERVE_FROM" -lt "$END" ]; then
            echo "มาก่อนเวลา — นอนรอถึง $OBSERVE_FROM_HHMM UTC อีก $(( (OBSERVE_FROM - now) / 60 )) นาที"
            sleep $(( OBSERVE_FROM - now ))
          fi

          # นอนจนถึงนาทีที่ 7/22/37/52 ถัดไป — ให้จังหวะเช็คตรงขอบ 15 นาทีจริง ๆ
          sleep_to_next_mark() {
            m=$(date -u +%-M); s=$(date -u +%-S)
            for t in 7 22 37 52; do
              if [ "$m" -lt "$t" ]; then echo $(( (t - m) * 60 - s )); return; fi
            done
            echo $(( (67 - m) * 60 - s ))
          }

          n=0
          while :; do
            n=$((n + 1))
            echo "───── รอบที่ $n · $(date -u +%H:%M:%S) UTC ─────"

            # || true ทุกคำสั่ง — รอบเดียวพังต้องไม่ทำให้ลูปทั้งวันตาย
            python send_report.py --no-cme $FLAGS || echo "!! send_report พังรอบนี้ ข้ามไป"
            # สองระบบเดินคู่กัน คนละ ledger — วันหนึ่งจะมีอย่างมากอันเดียวที่ ARMED
            # (fade ต้องการราคาในโซน · breakout ต้องการนอกโซน) เรียกทั้งคู่ทุกรอบได้เลย
            python run_forward_test.py record --system fade \
              || echo "!! record fade พังรอบนี้ ข้ามไป"
            python run_forward_test.py record --system breakout \
              || echo "!! record breakout พังรอบนี้ ข้ามไป"

            now=$(date -u +%s)
            [ "$now" -ge "$END" ] && break
            nap=$(sleep_to_next_mark)
            [ "$(( now + nap ))" -ge "$END" ] && break
            echo "นอน ${nap}s ถึงขอบถัดไป"
            sleep "$nap"
          done
          echo "จบ — เช็คไปทั้งหมด $n รอบ"

      - name: Save gate state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .gate-state.json
          key: gate-state-${{ github.run_id }}

      - name: Commit forward test ledger
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_test/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน — ไม่ต้อง commit"
            exit 0
          fi

          # ── รวมระดับข้อมูล ไม่ใช่ระดับข้อความ ──
          # เดิม commit แล้ว `git pull --rebase` + retry 3 รอบ · พังจริงที่ run #33:
          #   CONFLICT (content): Merge conflict in forward_test/log/2026-08.jsonl
          # retry ไม่ช่วยเลยเพราะไม่ใช่ race — เนื้อไฟล์ชนกันจริง ลองใหม่ก็ชนเหมือนเดิมทั้ง 3 รอบ
          # ไฟล์พวกนี้เป็นชุด record ที่มี key (trade id / ts+sym+sys) รวมได้แบบไม่มีทางขัดกัน
          STASH=$(mktemp -d)
          python merge_data.py --save "$STASH"

          pushed=""
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((i * 5)); continue; }
            git reset --hard "origin/${GITHUB_REF_NAME}"   # ปลอดภัย: ข้อมูลอยู่ใน $STASH แล้ว
            python merge_data.py --merge "$STASH"
            git add forward_test/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "หลังรวมแล้วไม่มีอะไรใหม่ (อีกงานบันทึกไปแล้ว) — ไม่ต้อง push"
              pushed="yes"; break
            fi
            git commit -m "forward test: เปิดไม้จำลอง [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed="yes"; break; fi
            echo "push รอบ $i ไม่สำเร็จ — ดึงของใหม่แล้วรวมอีกครั้ง"
            sleep $((i * 5))
          done

          rm -rf "$STASH"
          if [ -z "$pushed" ]; then
            echo "::error::push ข้อมูล forward test ไม่สำเร็จหลังลอง 3 รอบ"
            exit 1
          fi