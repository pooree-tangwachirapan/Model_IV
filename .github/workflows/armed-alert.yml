name: Armed Alert (intraday)

# ส่งเมล "เฉพาะตอนโครงสร้างเข้าเกณฑ์" ระหว่างวัน — เงียบถ้าไม่มีอะไร
#
# อ่านก่อนเปิดใช้ — ข้อจำกัดที่แก้ไม่ได้ 3 ข้อ:
#   1) cron ของ GitHub Actions ไม่ตรงเวลา ช่วงพีคดีเลย์ได้ 5–30 นาที (บางทีมากกว่า)
#      และรอบที่คิวยาวมาก GitHub ข้ามไปเลยก็มี → ใช้เป็น "ตัวเตือนให้ไปดู" ไม่ใช่ตัวจับจังหวะเข้า
#   2) ข้อมูล CBOE ดีเลย์ ~15 นาที และ OI อัปเดตข้ามคืน → level ที่เห็นตามหลังราคาจริงเสมอ
#   3) cron เป็น UTC ล้วน ไม่รู้จัก DST — เวลา ET จะเลื่อน 1 ชม. ปีละ 2 ครั้ง
#      ตารางล่างตั้งไว้สำหรับ EDT (มี.ค.–พ.ย.) · ช่วง EST ให้บวก 1 ชม. ที่ cron
#
# ทำไมเลือกเวลานี้: 10:30–13:00 ET คือหน้าต่างที่ charm/vanna เริ่มคุมเกม
# ส่วน 09:30–10:30 ET เป็นช่วง gamma whipsaw ที่ไม่ควรเข้าอยู่แล้ว จึงไม่ยิงเมล

on:
  schedule:
    - cron: "35 14 * * 1-5"   # 10:35 ET (EDT) — เปิดหน้าต่างเข้าไม้
    - cron: "30 16 * * 1-5"   # 12:30 ET (EDT) — กลางหน้าต่าง
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols คั่นด้วย , (เช่น QQQ,SPY)"
        required: false
        default: "QQQ"
      always_send:
        description: "ส่งแม้ไม่ ARMED (ไว้ทดสอบ)"
        type: boolean
        default: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Evaluate gate and alert if armed
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SYMBOLS:   ${{ inputs.symbols || 'QQQ' }}
        # --no-cme: COT อัปเดตสัปดาห์ละครั้ง ไม่มีประโยชน์กับเมลระหว่างวัน และทำให้ job ช้าลง
        run: |
          python send_report.py --no-cme \
            ${{ inputs.always_send == true && ' ' || '--armed-only' }}
