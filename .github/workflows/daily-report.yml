name: Daily Signal Recap

# ส่งอีเมลอัตโนมัติ จันทร์–ศุกร์
# 13:00 UTC = 09:00 ET (ก่อนตลาดเปิด 30 นาที) = 20:00 เวลาไทย
# แก้เวลาได้ที่ cron ด้านล่าง (เป็น UTC เสมอ)
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions
    inputs:
      symbols:
        description: "Symbols คั่นด้วย , (เช่น QQQ,SPY)"
        required: false
        default: "QQQ"

permissions:
  contents: write          # ต้องเขียน forward_test/log/ กลับเข้ารีโป

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Build and send report
        env:
          # SMTP_USER / SMTP_PASS = จำเป็น
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # 3 ตัวล่างไม่ตั้งก็ได้ — secret ที่ไม่มีจะมาเป็นค่าว่าง
          # send_report.py ถือว่า "ว่าง = ไม่ได้ตั้ง" แล้วใช้ default
          # (smtp.gmail.com : 587 · MAIL_TO ว่าง = ส่งหาตัวเอง)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SYMBOLS:   ${{ inputs.symbols || 'QQQ' }}
        run: |
          # เก็บ output แล้วโยนบรรทัดที่เป็น error ออกเป็น ::error:: ด้วย
          # ไม่งั้นเวลาพัง annotation บอกแค่ 'exit code 1' ซึ่งอ่านสาเหตุไม่ได้
          # ถ้าไม่มีสิทธิ์เปิด log (เกิดจริง 24-25 ส.ค.: เมลไม่ออกสองวันโดยไม่รู้สาเหตุ)
          set -o pipefail
          if python send_report.py 2>&1 | tee /tmp/send.log; then
            exit 0
          fi
          # ยิงบรรทัดท้าย ๆ ออกเป็น annotation ทีละบรรทัด — ไม่ต้อง match ข้อความ
          # (send() มีข้อความ error หลายแบบ จับด้วย pattern เดียวพลาดแน่)
          grep -av "^$" /tmp/send.log | tail -6 | while IFS= read -r L; do
            echo "::error::$L"
          done
          exit 1

      # send_report เขียน forward_test/log/ ทุกครั้งที่ประเมิน — ถ้าไม่ commit
      # มันจะถูกสร้างในรันเนอร์แล้วหายไปพร้อม job (พลาดมาแล้วกับ ledger_breakout)
      - name: Commit prediction log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_test/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน — ไม่ต้อง commit"
            exit 0
          fi

          # ── รวมระดับข้อมูล ไม่ใช่ระดับข้อความ ──
          # เดิม commit แล้ว `git pull --rebase` + retry 3 รอบ · พังจริงที่ run #33:
          #   CONFLICT (content): Merge conflict in forward_test/log/2026-08.jsonl
          # retry ไม่ช่วยเลยเพราะไม่ใช่ race — เนื้อไฟล์ชนกันจริง ลองใหม่ก็ชนเหมือนเดิมทั้ง 3 รอบ
          # ไฟล์พวกนี้เป็นชุด record ที่มี key (trade id / ts+sym+sys) รวมได้แบบไม่มีทางขัดกัน
          STASH=$(mktemp -d)
          python merge_data.py --save "$STASH"

          pushed=""
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((i * 5)); continue; }
            git reset --hard "origin/${GITHUB_REF_NAME}"   # ปลอดภัย: ข้อมูลอยู่ใน $STASH แล้ว
            python merge_data.py --merge "$STASH"
            git add forward_test/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "หลังรวมแล้วไม่มีอะไรใหม่ (อีกงานบันทึกไปแล้ว) — ไม่ต้อง push"
              pushed="yes"; break
            fi
            git commit -m "log: บันทึกการตัดสินรายวัน [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed="yes"; break; fi
            echo "push รอบ $i ไม่สำเร็จ — ดึงของใหม่แล้วรวมอีกครั้ง"
            sleep $((i * 5))
          done

          rm -rf "$STASH"
          if [ -z "$pushed" ]; then
            echo "::error::push ข้อมูล forward test ไม่สำเร็จหลังลอง 3 รอบ"
            exit 1
          fi