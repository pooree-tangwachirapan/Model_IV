name: Daily Signal Recap

# ส่งอีเมลอัตโนมัติ จันทร์–ศุกร์
# 13:00 UTC = 09:00 ET (ก่อนตลาดเปิด 30 นาที) = 20:00 เวลาไทย
# แก้เวลาได้ที่ cron ด้านล่าง (เป็น UTC เสมอ)
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions
    inputs:
      symbols:
        description: "Symbols คั่นด้วย , (เช่น QQQ,SPY)"
        required: false
        default: "QQQ"

permissions:
  contents: write          # ต้องเขียน forward_test/log/ กลับเข้ารีโป

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Build and send report
        env:
          # SMTP_USER / SMTP_PASS = จำเป็น
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # 3 ตัวล่างไม่ตั้งก็ได้ — secret ที่ไม่มีจะมาเป็นค่าว่าง
          # send_report.py ถือว่า "ว่าง = ไม่ได้ตั้ง" แล้วใช้ default
          # (smtp.gmail.com : 587 · MAIL_TO ว่าง = ส่งหาตัวเอง)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SYMBOLS:   ${{ inputs.symbols || 'QQQ' }}
        run: python send_report.py

      # send_report เขียน forward_test/log/ ทุกครั้งที่ประเมิน — ถ้าไม่ commit
      # มันจะถูกสร้างในรันเนอร์แล้วหายไปพร้อม job (พลาดมาแล้วกับ ledger_breakout)
      - name: Commit prediction log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_test/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "log ไม่เปลี่ยน — ไม่ต้อง commit"
          else
            git commit -m "log: บันทึกการตัดสินรายวัน [skip ci]"
            # rebase ต้องสำเร็จถึงจะ push · ล้มก็ abort แล้วลองใหม่
            # (`|| true` แบบเดิมกลืน conflict แล้ว push ทับด้วย HEAD ของ remote = ข้อมูลหาย)
            pushed=""
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                 && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed="yes"; break
              fi
              git rebase --abort 2>/dev/null || true
              echo "push รอบ $i ไม่สำเร็จ — รอแล้วลองใหม่"
              sleep $((i * 5))
            done
            if [ -z "$pushed" ]; then
              echo "::error::push log ไม่สำเร็จหลังลอง 3 รอบ"
              exit 1
            fi
          fi
