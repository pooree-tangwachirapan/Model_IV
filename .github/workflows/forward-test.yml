name: Forward Test (resolve + monthly report)

# หลังตลาดปิด: ปิดไม้จำลองที่ถึงเป้า / invalidate / หมดเวลา แล้ว commit ledger กลับเข้ารีโป
# วันที่ 1 ของเดือน: สรุปผลเดือนที่แล้วส่งเข้าเมล (ปลายทางเดียวกับรายงานรายวัน = MAIL_TO)
#
# ส่วน "เปิดไม้" ไม่ได้อยู่ที่นี่ — อยู่ในลูปของ armed-alert.yml เพราะไม้จะเปิดได้
# ต้องเป็นจังหวะที่ราคาชิดกำแพงจริงระหว่างวัน ไม่ใช่ราคาปิด

on:
  schedule:
    # GitHub ยิงสายได้หลายชั่วโมง (วัดได้ 220-590 นาที ดู daily-report.yml)
    # งานนี้ทนความสายได้เพราะแค่ต้อง "หลังตลาดปิด" ไม่ต้องตรงนาที
    # แต่ตั้งไว้ 2 ชั้น เผื่อชั้นแรกโดนทิ้ง — ชั้นที่สองเห็นว่าทำไปแล้วก็ไม่มีอะไรเปลี่ยน
    - cron: "11 21 * * 1-5"    # 17:11 ET — หลังตลาดปิด ปิดไม้ประจำวัน
    - cron: "41 23 * * 1-5"    # สำรอง
    - cron: "31 21 1 * *"      # วันที่ 1 ของเดือน — รายงานเดือนที่แล้ว + รวบ CSV 0DTE
  workflow_dispatch:
    inputs:
      month:
        description: "เดือนที่จะสรุป YYYY-MM (เว้นว่าง = ไม่ส่งรายงาน แค่ปิดไม้)"
        required: false
        default: ""

concurrency:
  group: forward-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore mail state
        uses: actions/cache/restore@v6
        with:
          path: .mail-sent.json
          key: mail-sent-${{ github.run_id }}
          restore-keys: mail-sent-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Resolve open trades
        run: |
          python run_forward_test.py resolve --system fade
          python run_forward_test.py resolve --system breakout

      # `if: always()` เพราะขั้นตอนก่อนหน้าอาจพังจากเน็ต — ถ้าไม่ใส่
      # ผลการปิดไม้ของระบบที่ resolve สำเร็จไปแล้วจะหายไปด้วยแบบเงียบ ๆ
      - name: Commit ledger
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ── รวมระดับข้อมูล ไม่ใช่ระดับข้อความ ──
          # เดิม commit แล้ว `git pull --rebase` + retry 3 รอบ · พังจริงที่ run #33:
          #   CONFLICT (content): Merge conflict in forward_test/log/2026-08.jsonl
          # retry ไม่ช่วยเลยเพราะไม่ใช่ race — เนื้อไฟล์ชนกันจริง ลองใหม่ก็ชนเหมือนเดิมทั้ง 3 รอบ
          # ไฟล์พวกนี้เป็นชุด record ที่มี key (trade id / ts+sym+sys) รวมได้แบบไม่มีทางขัดกัน
          STASH=$(mktemp -d)
          python merge_data.py --save "$STASH"

          pushed=""
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || { sleep $((i * 5)); continue; }
            git reset --hard "origin/${GITHUB_REF_NAME}"   # ปลอดภัย: ข้อมูลอยู่ใน $STASH แล้ว
            python merge_data.py --merge "$STASH"

            # รวบ CSV 0DTE ของเดือนที่จบแล้วเป็นคลัง .csv.gz (เหตุผลใน zero_dte.py)
            # **ต้องทำตรงนี้ หลัง reset --hard** ไม่ใช่เป็น step แยกก่อนหน้า:
            # reset เอาไฟล์รายวันทั้งหมดกลับมาจาก remote ถ้า rollup ทำไปก่อน
            # การลบไฟล์รายวันจะถูกย้อนคืน เหลือแต่ .csv.gz ที่ซ้ำกับของเดิม
            # (บั๊กนี้ทำให้ rollup ไม่เคยได้ผลจริงบน CI เลยสักครั้ง)
            python zero_dte_cli.py rollup \
              || echo "!! รวบ 0DTE ไม่สำเร็จ — ข้ามไป ข้อมูลยังอยู่ครบ"

            # add ทีละโฟลเดอร์ — `git add a/ b/` ถ้า b/ ไม่มี git ล้มทั้งคำสั่ง
            # โดยไม่ stage a/ ด้วย แล้วเรามองไม่เห็นเพราะกลืน error ไว้
            for d in forward_test zero_dte; do
              [ -d "$d" ] && git add -A -- "$d"
            done
            if git diff --cached --quiet; then
              echo "หลังรวมแล้วไม่มีอะไรใหม่ (อีกงานบันทึกไปแล้ว) — ไม่ต้อง push"
              pushed="yes"; break
            fi
            git commit -m "forward test: ปิดไม้จำลอง [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed="yes"; break; fi
            echo "push รอบ $i ไม่สำเร็จ — ดึงของใหม่แล้วรวมอีกครั้ง"
            sleep $((i * 5))
          done

          rm -rf "$STASH"
          if [ -z "$pushed" ]; then
            echo "::error::push ข้อมูล forward test ไม่สำเร็จหลังลอง 3 รอบ"
            exit 1
          fi
      # ส่งรายงานเมื่อ: กดเองพร้อมระบุเดือน หรือ วันนี้เป็น**วันทำการแรกของเดือน**
      - name: Monthly report
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          PICKED:    ${{ inputs.month }}
        run: |
          # ของเดิมเช็ค `date -u +%d = "01"` ซึ่ง **พังเพราะดีเลย์ของ GitHub**:
          # cron ตั้ง 21:31 UTC ของวันที่ 1 · ดีเลย์เฉลี่ยที่วัดได้ 262 นาที
          # → เวลาจริงข้ามเที่ยงคืนเป็นวันที่ 2 → ตอบ "02" → ข้ามเงียบ
          # รายงานรายเดือนจึงแทบไม่เคยออกเลย (บั๊กคลาสเดียวกับ §6.9)
          # และถ้าวันไหน GitHub ตรงเวลา cron ทั้ง 3 ชั้นก็ผ่านหมด → ส่ง 6 ใบ
          #
          # ตอนนี้ถามปฏิทินแทนนาฬิกา: "วันนี้เป็นวันทำการแรกของเดือนไหม"
          # ซึ่งจริงวันเดียวต่อเดือนไม่ว่างานจะเริ่มตอนไหน และข้ามวันหยุด/เสาร์อาทิตย์ให้เอง
          # ส่วนการส่งซ้ำกันด้วย mail_state.py เหมือนเมลรายวัน
          MONTH="$PICKED"
          if [ -z "$MONTH" ]; then
            MONTH=$(python market_clock.py report-month || true)
          fi
          if [ -z "$MONTH" ]; then
            echo "ยังไม่ถึงรอบรายงาน (ไม่ใช่วันทำการแรกของเดือน) — ข้าม"
            exit 0
          fi
          if ! python mail_state.py check "monthly-$MONTH" >/dev/null; then
            echo "รายงานเดือน $MONTH ส่งไปแล้ว — ข้าม"
            exit 0
          fi
          echo "ส่งรายงานเดือน $MONTH"
          # ส่งแยกใบต่อระบบ — รวมใบเดียวแล้วสถิติสองระบบจะปนกันจนอ่านไม่ได้
          python run_forward_test.py report --system fade     --month "$MONTH" --email
          python run_forward_test.py report --system breakout --month "$MONTH" --email
          python mail_state.py mark "monthly-$MONTH" || echo "!! บันทึกสถานะไม่สำเร็จ"

      - name: Save mail state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .mail-sent.json
          key: mail-sent-${{ github.run_id }}
