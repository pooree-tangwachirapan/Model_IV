name: Daily Signal Recap

# ส่งอีเมลอัตโนมัติ จันทร์–ศุกร์
# 13:00 UTC = 09:00 ET (ก่อนตลาดเปิด 30 นาที) = 20:00 เวลาไทย
# แก้เวลาได้ที่ cron ด้านล่าง (เป็น UTC เสมอ)
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions
    inputs:
      symbols:
        description: "Symbols คั่นด้วย , (เช่น QQQ,SPY)"
        required: false
        default: "QQQ"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit numpy pandas scipy plotly requests yfinance

      - name: Build and send report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          SYMBOLS:   ${{ inputs.symbols || 'QQQ' }}
        run: python send_report.py
